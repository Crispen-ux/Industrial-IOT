services:
  - type: web
    name: scale-iot
    runtime: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: node backend/server.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GATEWAY_API_KEY
        sync: false
      - key: NODE_ENV
        value: production
    healthCheckPath: /api/alert-config
